[workspace]
members = [".", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Proprietary"
publish = false

[workspace.dependencies]
atomic-write-file = "0.3.0"
glam = { version = "0.33.2", features = ["serde"] }
png = "0.18.0"
pollster = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[package]
name = "chess3d"
description = "Original procedural marble chess scene and position persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
viewer = ["worldrunner/scene-viewer"]

[dependencies]
atomic-write-file.workspace = true
glam.workspace = true
png.workspace = true
pollster.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
worldrunner = { git = "https://github.com/acoliver/real-disunity.git", rev = "1ead975c7cf3efe672aad3e4f7a8050233843ad6", default-features = false, features = ["scene"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
